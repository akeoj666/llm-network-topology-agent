meta:
  id: UC-94
  title: ACL 隔离并放行服务器
  source_prompt: 研发部 192.168.30.0/24 和财务部 192.168.40.0/24 各挂一台交换机和一台 PC，另有一台服务器在 100.100.100.0/24，两台路由器串口相连。要求研发部不能访问财务部，但两边都能访问服务器，用
    OSPF 加 ACL 实现
subnets:
- cidr: 10.0.0.0/30
  name: R1-R2
  hosts: 0
- cidr: 192.168.30.0/24
  name: rd
  gateway: 192.168.30.1
  hosts: 1
- cidr: 192.168.40.0/24
  name: fin
  gateway: 192.168.40.1
  hosts: 1
- cidr: 100.100.100.0/24
  name: server
  gateway: 100.100.100.1
  hosts: 1
devices:
- name: R1
  role: router
  model: Router-PT-Empty
  interfaces:
  - name: FastEthernet2/0
    ip: 192.168.30.1/24
  - name: Serial0/0
    ip: 10.0.0.1/30
  - name: Serial1/0
    shutdown: true
  - name: FastEthernet3/0
    shutdown: true
- name: R2
  role: router
  model: Router-PT-Empty
  interfaces:
  - name: FastEthernet2/0
    ip: 192.168.40.1/24
  - name: FastEthernet3/0
    ip: 100.100.100.1/24
  - name: Serial1/0
    ip: 10.0.0.2/30
  - name: Serial0/0
    shutdown: true
- name: SW0
  role: switch
  model: 2960-24TT
  interfaces:
  - name: FastEthernet0/1
  - name: FastEthernet0/24
- name: SW1
  role: switch
  model: 2960-24TT
  interfaces:
  - name: FastEthernet0/1
  - name: FastEthernet0/24
- name: SW2
  role: switch
  model: 2960-24TT
  interfaces:
  - name: FastEthernet0/1
  - name: FastEthernet0/24
- name: PC0
  role: pc
  model: PC-PT
  ip: 192.168.30.10/24
  gateway: 192.168.30.1
- name: PC1
  role: pc
  model: PC-PT
  ip: 192.168.40.10/24
  gateway: 192.168.40.1
- name: Server0
  role: server
  model: PC-PT
  ip: 100.100.100.10/24
  gateway: 100.100.100.1
links:
- from: R1:Serial0/0
  to: R2:Serial1/0
  cable: serial
  subnet: 10.0.0.0/30
- from: PC0:FastEthernet0
  to: SW0:FastEthernet0/1
  cable: copper
- from: SW0:FastEthernet0/24
  to: R1:FastEthernet2/0
  cable: copper
- from: PC1:FastEthernet0
  to: SW1:FastEthernet0/1
  cable: copper
- from: SW1:FastEthernet0/24
  to: R2:FastEthernet2/0
  cable: copper
- from: Server0:FastEthernet0
  to: SW2:FastEthernet0/1
  cable: copper
- from: SW2:FastEthernet0/24
  to: R2:FastEthernet3/0
  cable: copper
routing:
- device: R1
  protocol: ospf
  process: 1
  area: 0
- device: R2
  protocol: ospf
  process: 1
  area: 0
acls:
- id: 100
  type: extended
  rules:
  - action: deny
    protocol: ip
    source: 192.168.30.0/24
    destination: 192.168.40.0/24
  - action: permit
    protocol: ip
    source: any
    destination: any
  apply:
  - device: R1
    interface: FastEthernet2/0
    direction: in

# 验收断言：这些主机对应该通 / 不通（tools/accept.py 据此判定通过）
expect:
  reach:
    - [PC0, Server0]
    - [PC1, PC0]
    - [PC1, Server0]
    - [Server0, PC0]
  block:
    - [PC0, PC1]
