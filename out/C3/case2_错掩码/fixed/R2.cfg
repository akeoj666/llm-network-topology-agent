version 12.2
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname R2
!
no ip cef
no ipv6 cef
!
interface Serial1/0
 ip address 10.0.0.2 255.255.255.252
 clock rate 2000000
 no shutdown
!
interface Serial0/0
 ip address 10.0.0.21 255.255.255.252
 no shutdown
!
interface FastEthernet2/0
 no ip address
 shutdown
!
interface FastEthernet3/0
 no ip address
 shutdown
!
router rip
 version 2
 no auto-summary
 network 10.0.0.0
!
ip classless
!
line con 0
!
line vty 0 4
 login
!
end
