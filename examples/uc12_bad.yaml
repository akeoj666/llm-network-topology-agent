# UC-12 需求评审陷阱：只有 192.168.1.0/25 这个池，却要给三个部门各划一个 /24
# 期望：地址池包含性检查直接拦住（128 个地址装不下 3×256）
meta:
  id: UC-12
  title: 需求评审陷阱（应被拒绝）
  source_prompt: 用 192.168.1.0/25 这个网段，给三个部门各划一个 /24 的子网，都要能互通。

pool: 192.168.1.0/25

subnets:
  - { cidr: 192.168.1.0/24, name: 部门A, gateway: 192.168.1.254, hosts: 20 }
  - { cidr: 192.168.2.0/24, name: 部门B, gateway: 192.168.2.254, hosts: 20 }
  - { cidr: 192.168.3.0/24, name: 部门C, gateway: 192.168.3.254, hosts: 20 }

devices:
  - name: R1
    role: router
    pos: [3, 3]
    interfaces:
      - { name: GigabitEthernet0/0, ip: 192.168.1.254/24 }
      - { name: GigabitEthernet0/1, ip: 192.168.2.254/24 }
  - name: SW1
    role: switch
    pos: [1, 1]
  - name: PC1
    role: pc
    pos: [0.5, 0.5]
    ip: 192.168.1.10/24
    gateway: 192.168.1.254
  - name: PC2
    role: pc
    pos: [5, 0.5]
    ip: 192.168.2.10/24
    gateway: 192.168.2.254

links:
  - { from: "PC1:FastEthernet0", to: "SW1:FastEthernet0/1" }
  - { from: "PC2:FastEthernet0", to: "SW1:FastEthernet0/2" }
  - { from: "SW1:FastEthernet0/24", to: "R1:GigabitEthernet0/0" }
